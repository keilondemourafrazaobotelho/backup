<!DOCTYPE html>
<html lang="PT-BR">
<head>
     <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos de Lanchonete</title>
</head>
<body>
    <form id="formPedido">
    
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
        <br><br>
        
 
        <label for="lanche">Escolha o Lanche:</label>
        <select id="lanche" name="lanche" required>
            <option value="">Selecione um lanche</option>
            <option value="15">X-Burger - 15,00</option>
            <option value="18">X-Salada - 18,00</option>
            <option value="22">X-Bacon - 22,00</option>
        </select>
        <br><br>
        

        <label for="quantidade">Quantidade:</label>
        <input type="number" id="quantidade" min="1" value="1" required>
        <br><br>

        <label for="bebida">Escolha a Bebida:</label>
        <select id="bebida" required>
            <option value="">Selecione uma bebida</option>
            <option value="0">Nenhuma bebida - 0,00</option>
           
            <option value="6">Refrigerante - 6,00</option>
            <option value="7">Suco Natural - 7,00</option>
            <option value="3">Água - 3,00</option>
        </select>

        <br><br>

        <button type="submit">Enviar Pedido</button>
    </form>
    
    
    <div id="resultado"></div>

    <script src="script.js"></script>
</body>
</html>
