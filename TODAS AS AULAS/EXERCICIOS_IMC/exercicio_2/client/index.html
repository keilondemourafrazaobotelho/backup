<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Times</title>
</head>
<body>
    <center>
        <form action="http://127.0.0.1:3000" method="post">
            <h1>Cadastro de Times</h1>

            <input type="number" placeholder="Identificação" name="id" required>
            <br><br>

            <input type="text" placeholder="Nome do Time" name="nome" required>
            <br><br>

            <input type="number" placeholder="Vitorias" name="vitorias" required>
            <br><br>

            <input type="number" placeholder="Derrotas" name="derrotas" required>
            <br><br>

            <input type="number" placeholder="Empates" name="empates" required>
            <br><br>

            <button type="reset">Limpar</button>
            <button type="submit">Enviar</button>
        </form>
    </center>
</body>
</html>
