<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcular IMC</title>
</head>
<body>
    <center>
        <h1>Novo Paciente</h1>
        <form action="http://localhost:3000" method="post">
            <input type="number" placeholder="Identificação" name="id" required>
            <br><br>

            <input type="date" placeholder="Data" name="data" required>
            <br><br>

            <input type="text" placeholder="Nome" name="nome" required>
            <br><br>

            <input type="number" placeholder="Peso" name="peso" required>
            <br><br>

            <input type="number" placeholder="Altura" name="Altura" step="0.01" required>
            <br><br>

            <button type="reset">Limpar</button>
            <button type="submit">Enviar</button>
        </form>
    </center>
</body>
</html>
