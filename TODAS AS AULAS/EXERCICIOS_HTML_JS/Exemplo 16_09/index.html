<body>
     <center>
        <h1>Calculando Nota</h1>

           <br><br>

           <label for="nota2">Segunda Nota: </label>

           <br><br>

           <label for="nota3">Terceira Nota: </label>
           <input type="number" id="nota3">
           <br><br>


           <button type="button" onclick="CalcularResultado()">Calcular Resultado</button>
        </form>

        <hr>

        <h2>Resultado</h2>
        
        <p id="resultado"></p>

    </center>
