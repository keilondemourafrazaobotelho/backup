
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade_03</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <center>
        <h1>Caixa Registradora</h1>
        
        <label for="preco">Preço do Produto (R$):</label> 
        <input type="number" id="preco"  min="0" required>
        <br>
                
        <label for="quantidade">Quantidade:</label>
        <input type="number" id="quantidade">
        <br>  
                
 
        <label for="pagamento">Forma de Pagamento:</label>
        <select id="pagamento">
            <option value="dinheiro">Dinheiro (10% de desconto)</option>
            <option value="pix">Pix (5% de desconto)</option>
            <option value="cartao">Cartão (Sem desconto)</option>
        </select>
                
                  
        <br>
        <button onclick="calcularCompra()">Calcular Total</button>
        <div class="resultado" id="resultado" style="display: none;">
                            
        <hr>

        <h3>Resumo da Compra</h3>
        <p>Subtotal: <span id="resSubtotal" class="destaque">R$ 0.00</span></p>
        <p>Desconto: <span id="resDesconto" class="destaque">R$ 0.00</span></p>
        <p>Total a Pagar: <span id="resTotal" class="destaque">R$ 0.00</span></p>
                
    </center>
<script src="script.js"></script>
</body>
</html>
