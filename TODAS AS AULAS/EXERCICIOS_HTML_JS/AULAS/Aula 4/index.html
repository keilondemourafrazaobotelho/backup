<!--
    <header> -> Cabeçalho
    <nav> -> Área de Navegação
    <main> -> Conteúdo principal
    <section> -> Seção de conteúdo
    <article> -> Conteúdo Independente
    <aside> -> Conteúdo complementar/lateral
    <footer> -> Rodapé
    <figure> -> Conteúdo visual, como uma imagem.                        
    <figcaption> -> legenda de um figura
    <time> -> data ou horário
    <address> Informações de contato

-->
  <!DOCTYPE html>
  <html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semântica</title>

  </head>
  <body>
       <header>
           Cabeçalho
       </header>
       
       <nav>
           Menu      
       </nav>

       <main>
            <section>
                 Seção Principal 
            </section>
            
            <article>
                 Artigo
            </article>    
            
            <aside>
                Conteúdo lateral
            </aside>

       </main>
       
       <footer>
           Rodapé 
       </footer>



  </body>
  </html>
